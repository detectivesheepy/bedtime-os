<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden; /* Prevents scrollbars from appearing */
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    
    /* Expanded to cover the absolute full width and height of the monitor screen */
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden; /* Cuts off all cropped UI edges */
    }
    
    /* Invisible interactive layer for the click-to-unmute trigger */
    .click-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
    }
    
    /* Uniform Percentage Zoom: 
       Pushes controls and header strings out of view on all viewport sizes */
    #live-stream-player {
      position: absolute;
      top: -15%;       
      left: -10%;      
      width: 120%;     
      height: 130%;    
      border: 0;
    }
    
    /* Floating full-screen unmute banner */
    .unmute-banner {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .unmute-banner.hidden {
      opacity: 0;
      transform: translate(-50%, 15px);
    }
  </style>
</head>
<body>

<div class="video-container">
  <div class="click-shield" id="unmute-trigger"></div>
  
  <div class="unmute-banner" id="unmute-text">
    🔊 Click Anywhere to Unmute Live Audio
  </div>

  <iframe 
    id="live-stream-player"
    src="https://www.youtube.com/embed/vOTiJkg1voo" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
</div>

<script>
  const trigger = document.getElementById('unmute-trigger');
  const banner = document.getElementById('unmute-text');
  const playerFrame = document.getElementById('live-stream-player');

  trigger.addEventListener('click', function() {
    if (playerFrame && playerFrame.contentWindow) {
      // Sends the text-string unmute command straight into the YouTube API pipeline
      playerFrame.contentWindow.postMessage(
        JSON.stringify({ event: 'command', func: 'unMute', args: [] }), 
        '*'
      );
      
      banner.classList.add('hidden'); // Clear out the layout overlay banner
      trigger.style.pointerEvents = 'none'; // Drops the protective pane out of rotation
    }
  });
</script>

</body>
</html>
