<style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .click-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
    }
    #yt-player {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

<div class="video-wrapper">
  <div class="click-shield"></div>
  <div id="yt-player"></div>
</div>

<!-- Core Google API Engine Loader Script Element -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      // 1. Insert your active video ID right here:
      videoId: 'vOTiJkg1voo', 
      playerVars: {
        'autoplay': 1,
        'mute': 0,
        'controls': 0,          /* Natively deletes the bottom timeline track controls */
        'modestbranding': 1,   /* Hides the oversized YouTube watermarked label overlay */
        'rel': 0,               /* Prevents recommended grids when playback finishes */
        'showinfo': 0,          /* Deletes the top video title header line completely */
        'iv_load_policy': 3     /* Strips channel pop-up notes or card banners */
        'cc_load_policy': 0     /* Turns off captions */
      },
      events: {
        'onReady': onPlayerReady
      }
    });
  }

  function onPlayerReady(event) {
    event.target.playVideo();
  }
</script>
