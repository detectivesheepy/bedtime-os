<div style="
  position: relative; 
  width: 100%; 
  max-width: 800px; 
  aspect-ratio: 16 / 9; 
  overflow: hidden; 
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
">
  <!-- CSS Pointer Mask: Prevents hover states and clicking to bring up the timeline overlay -->
  <div style="
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    z-index: 10; 
    background: transparent;
  "></div>

  <!-- The Cropped Video Iframe -->
  <iframe 
    src="https://www.youtube.com/embed/vOTiJkg1voo?autoplay=1" 
    style="
      position: absolute;
      top: -60px; 
      left: 0;
      width: 100%;
      height: calc(100% + 120px); 
      border: 0;
    "
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
</div>
