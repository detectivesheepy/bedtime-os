<script>
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      // 1. Insert your active video ID right here:
      videoId: 'vOTiJkg1voo', 
      playerVars: {
        'autoplay': 1,
        'mute': 1,
        'controls': 0,          /* Natively deletes the bottom timeline track controls */
        'modestbranding': 1,   /* Hides the oversized YouTube watermarked label overlay */
        'rel': 0,               /* Prevents recommended grids when playback finishes */
        'showinfo': 0,          /* Deletes the top video title header line completely */
        'iv_load_policy': 3     /* Strips channel pop-up notes or card banners */
      },
      events: {
        'onReady': onPlayerReady
      }
    });
  }

  function onPlayerReady(event) {
    event.target.playVideo();
  }
</script>
