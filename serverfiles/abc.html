<!-- Include Hls.js library for universal browser compatibility -->
<script src="https://jsdelivr.net"></script>

<!-- The HTML5 Video Element -->
<video id="abc-news-player" controls autoplay muted style="width:100%; max-width:800px; aspect-ratio:16/9;"></video>

<script>
  // ABC News US multi-platform master manifest stream URL
  const streamUrl = 'https://uplynk.com';
  const video = document.getElementById('abc-news-player');

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Native fallback for Safari
    video.src = streamUrl;
  }
</script>
